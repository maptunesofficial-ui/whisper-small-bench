name: WhisperBench
options:
  bundleIdPrefix: org.whisperbench
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
targets:
  WhisperBench:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.whisperbench.app
        INFOPLIST_KEY_CFBundleDisplayName: WhisperBench
    dependencies:
      - framework: whisper.xcframework
        embed: EMBED_FLAG
